<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding-top: 20px;
        }

        .sidebar h3 {
            text-align: center;
            padding: 20px;
            margin: 0;
            border-bottom: 1px solid #34495e;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            padding: 15px 20px;
            border-bottom: 1px solid #34495e;
        }

        .sidebar li:hover {
            background-color: #34495e;
            cursor: pointer;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            background-color: #f9f9f9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            color: #222;
        }

        .btn-edit {
            background-color: #007bff;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
        }

        .btn-edit:hover {
            background-color: #0056b3;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .button-group {
            display: inline-flex;
            margin-bottom: 20px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #28a745;
        }

        .users-table-btn {
            background-color: transparent;
            color: #28a745;
            padding: 6px 15px;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            border: none;
            border-right: 1px solid #28a745;
            cursor: pointer;
        }

        .new-user-btn {
            background-color: transparent;
            color: #007bff;
            padding: 6px 15px;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        h4 {
            margin-top: 0;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h3>Menu</h3>
        <ul>
            <li><a th:href="@{/admin}">Admin</a></li>
            <li><a th:href="@{/user}">User</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="button-group">
            <a th:href="@{/admin}" class="users-table-btn">Users table</a>
            <a th:href="@{/admin/add}" class="new-user-btn">New User</a>
        </div>

        <h4>All users</h4>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">2</td>
                <td th:text="${user.name}">admin</td>
                <td th:text="${user.surname}">admin</td>
                <td th:text="${user.age}">35</td>
                <td th:text="${user.email}">admin@mail.ru</td>
                <td>
                    <span th:each="role, iterStat : ${user.roles}">
                        <span th:text="${#strings.replace(role.name, 'ROLE_', '')}"></span>
                        <span th:if="${!iterStat.last}"> </span>
                    </span>
                </td>
                <td>
                    <!-- ССЫЛКА на страницу редактирования, а НЕ модальное окно -->
                    <a th:href="@{/admin/edit/{id}(id=${user.id})}" class="btn-edit">Edit</a>
                </td>
                <td>
                    <a th:href="@{/admin/delete/{id}(id=${user.id})}" class="btn-delete" onclick="return confirm('Are you sure?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
