<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>
<body>
<h2>Список Юзеров</h2>

<table>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.name}">name</td>
        <td th:text="${user.surname}">surname</td>
        <td th:text="${user.age}">age</td>
        <td>
            <a th:href="@{/admin/edit/{id}(id=${user.id})}">Изменить</a>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a th:href="@{/admin/add}">Добавить еще одного</a>

</body>
</html>
