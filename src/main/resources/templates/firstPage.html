<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding-top: 20px;
        }

        .sidebar h3 {
            text-align: center;
            padding: 20px;
            margin: 0;
            border-bottom: 1px solid #34495e;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            padding: 15px 20px;
            border-bottom: 1px solid #34495e;
        }

        .sidebar li:hover {
            background-color: #34495e;
            cursor: pointer;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            background-color: #f9f9f9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            color: #222;
        }

        .btn-edit {
            background-color: #007bff;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-edit:hover {
            background-color: #0056b3;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .button-group {
            display: inline-flex;
            margin-bottom: 20px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #28a745;
        }

        .users-table-btn {
            background-color: transparent;
            color: #28a745;
            padding: 6px 15px;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            border: none;
            border-right: 1px solid #28a745;
            cursor: pointer;
        }

        .new-user-btn {
            background-color: transparent;
            color: #007bff;
            padding: 6px 15px;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        h4 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background-color: white;
            width: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .modal-header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .user-info {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 13px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #007bff;
        }

        .modal-footer {
            padding: 15px 20px;
            background-color: #f8f9fa;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-close-modal {
            background-color: #6c757d;
            color: white;
        }

        .btn-save {
            background-color: #007bff;
            color: white;
        }

        .btn-save:hover {
            background-color: #0056b3;
        }

        .btn-close-modal:hover {
            background-color: #5a6268;
        }

        /* Стили для чекбоксов ролей */
        .checkbox-group {
            display: flex;
            gap: 20px;
            padding: 10px 0;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
            margin: 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h3>Menu</h3>
        <ul>
            <li><a th:href="@{/admin}">Admin</a></li>
            <li><a th:href="@{/user}">User</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="button-group">
            <a th:href="@{/admin}" class="users-table-btn">Users table</a>
            <a th:href="@{/admin/add}" class="new-user-btn">New User</a>
        </div>

        <h4>All users</h4>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">2</td>
                <td th:text="${user.name}">admin</td>
                <td th:text="${user.surname}">admin</td>
                <td th:text="${user.age}">35</td>
                <td th:text="${user.email}">admin@mail.ru</td>
                <td>
                        <span th:each="role, iterStat : ${user.roles}">
                            <span th:text="${#strings.replace(role.name, 'ROLE_', '')}"></span>
                            <span th:if="${!iterStat.last}"> </span>
                        </span>
                </td>
                <td>
                    <button class="btn-edit" th:data-id="${user.id}" onclick="openEditModal(this.getAttribute('data-id'))">Edit</button>
                </td>
                <td>
                    <a th:href="@{/admin/delete/{id}(id=${user.id})}" class="btn-delete" onclick="return confirm('Are you sure?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Модальное окно -->
<div id="editModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3>✏️ Edit User</h3>
            <button class="close-modal-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="user-info">
                <p>📧 <strong id="modalEmail"></strong> | Current roles: <strong id="modalRoles"></strong></p>
            </div>

            <form id="editForm" method="post">
                <input type="hidden" id="userId" name="id"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="userName" name="name"/>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="userSurname" name="surname"/>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="userAge" name="age"/>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="userEmail" name="email"/>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="userPassword" name="password" placeholder="Leave blank to keep current"/>
                    <small style="color: #666; font-size: 11px;">Only enter if you want to change password</small>
                </div>

                <div class="form-group">
                    <label>Roles</label>
                    <div id="rolesCheckboxes" class="checkbox-group">
                        <!-- Чекбоксы будут добавлены через JavaScript -->
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-close-modal" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-save">💾 Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    // Получаем данные из Spring
    var usersData = /*[[${users}]]*/ [];
    var allRolesData = /*[[${roles}]]*/ [];

    console.log("=== DATA FROM SPRING ===");
    console.log("usersData:", usersData);
    console.log("allRolesData:", allRolesData);

    // Функция для создания чекбоксов ролей
    function createRoleCheckboxes() {
        var container = document.getElementById('rolesCheckboxes');
        if (!container) return;

        container.innerHTML = '';

        if (allRolesData && allRolesData.length > 0) {
            for (var i = 0; i < allRolesData.length; i++) {
                var role = allRolesData[i];
                var roleName = role.name ? role.name.replace('ROLE_', '') : '';

                var label = document.createElement('label');
                var checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.name = 'roles';
                checkbox.value = role.id;
                checkbox.className = 'role-checkbox';

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(' ' + roleName));
                container.appendChild(label);
            }
        } else {
            container.innerHTML = '<span style="color: red;">No roles available</span>';
        }
    }

    // Функция для установки выбранных ролей
    function setSelectedRoles(userRoles) {
        var checkboxes = document.querySelectorAll('#rolesCheckboxes input[type="checkbox"]');
        for (var i = 0; i < checkboxes.length; i++) {
            var checkbox = checkboxes[i];
            var roleId = parseInt(checkbox.value);
            checkbox.checked = false;

            if (userRoles && userRoles.length > 0) {
                for (var j = 0; j < userRoles.length; j++) {
                    if (userRoles[j].id === roleId) {
                        checkbox.checked = true;
                        break;
                    }
                }
            }
        }
    }

    // Создаем чекбоксы при загрузке страницы
    createRoleCheckboxes();

    function openEditModal(userId) {
        console.log("openEditModal called with userId:", userId);

        if (!usersData) {
            console.error("usersData is undefined or null!");
            alert("Error: usersData not loaded!");
            return;
        }

        // Находим пользователя
        var user = null;
        if (Array.isArray(usersData)) {
            for (var i = 0; i < usersData.length; i++) {
                if (usersData[i].id == userId) {
                    user = usersData[i];
                    break;
                }
            }
        }

        if (user) {
            console.log("User found:", user);

            // Заполняем информацию о пользователе
            document.getElementById('modalEmail').textContent = user.email || '';

            var rolesText = '';
            if (user.roles && user.roles.length > 0) {
                for (var i = 0; i < user.roles.length; i++) {
                    var roleName = user.roles[i].name ? user.roles[i].name.replace('ROLE_', '') : '';
                    rolesText += roleName;
                    if (i < user.roles.length - 1) rolesText += ', ';
                }
            }
            document.getElementById('modalRoles').textContent = rolesText || 'No roles';

            // Заполняем форму
            document.getElementById('userId').value = user.id;
            document.getElementById('userName').value = user.name || '';
            document.getElementById('userSurname').value = user.surname || '';
            document.getElementById('userAge').value = user.age || '';
            document.getElementById('userEmail').value = user.email || '';
            document.getElementById('userPassword').value = '';

            // Устанавливаем выбранные роли в чекбоксах
            setSelectedRoles(user.roles);

            // Устанавливаем action формы
            document.getElementById('editForm').action = '/admin/update';

            // Показываем модальное окно
            document.getElementById('editModal').classList.add('show');
        } else {
            console.error("User NOT found! ID:", userId);
            alert("User not found! ID: " + userId);
        }
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('show');
    }

    // Закрытие по клику на оверлей
    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });

    // Закрытие по ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeModal();
        }
    });
    /*]]>*/
</script>

</body>
</html>
