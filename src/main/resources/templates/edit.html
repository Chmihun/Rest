<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding-top: 20px;
        }

        .sidebar h3 {
            text-align: center;
            padding: 20px;
            margin: 0;
            border-bottom: 1px solid #34495e;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            padding: 15px 20px;
            border-bottom: 1px solid #34495e;
        }

        .sidebar li:hover {
            background-color: #34495e;
            cursor: pointer;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .form-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-left: 10px;
        }

        .btn-cancel:hover {
            background-color: #5a6268;
        }

        h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h3>Menu</h3>
        <ul>
            <li><a th:href="@{/admin}">Admin</a></li>
            <li><a th:href="@{/user}">User</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="form-container">
            <h2>Edit User</h2>

            <form th:action="@{/admin/update}" th:object="${user}" method="post">
                <!-- Скрытое поле для ID -->
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label for="name">First Name:</label>
                    <input type="text" id="name" th:field="*{name}" required />
                </div>

                <div class="form-group">
                    <label for="surname">Last Name:</label>
                    <!-- ВАЖНО: используем surname, а не lastName -->
                    <input type="text" id="surname" th:field="*{surname}" required />
                </div>

                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" th:field="*{age}" required />
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" th:field="*{email}" required />
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" th:field="*{password}" />
                    <small style="color: #666;">Leave blank to keep current password</small>
                </div>

                <div class="form-group">
                    <label for="roles">Roles:</label>
                    <select id="roles" th:field="*{roles}" multiple="multiple" size="3">
                        <option th:each="role : ${allRoles}"
                                th:value="${role.id}"
                                th:text="${#strings.replace(role.name, 'ROLE_', '')}"
                                th:selected="${user.roles.contains(role)}"></option>
                    </select>
                    <small style="color: #666;">Hold Ctrl/Cmd to select multiple roles</small>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit">Update User</button>
                    <a th:href="@{/admin}" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
