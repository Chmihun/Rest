<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Модальное окно */
        .modal {
            background-color: white;
            width: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Заголовок */
        .modal-header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            text-decoration: none;
        }

        .close-btn:hover {
            color: #ddd;
        }

        /* Тело модального окна */
        .modal-body {
            padding: 20px;
        }

        /* Информация о пользователе */
        .user-info {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .user-info p {
            margin: 5px 0;
        }

        /* Форма */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 13px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #007bff;
        }

        /* Выпадающий список для ролей */
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
        }

        /* Кнопки */
        .modal-footer {
            padding: 15px 20px;
            background-color: #f8f9fa;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-close {
            background-color: #6c757d;
            color: white;
        }

        .btn-close:hover {
            background-color: #5a6268;
        }

        .btn-edit {
            background-color: #007bff;
            color: white;
        }

        .btn-edit:hover {
            background-color: #0056b3;
        }

        /* Бейджи ролей */
        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }

        .role-admin {
            background-color: #dc3545;
            color: white;
        }

        .role-user {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>

<div class="modal">
    <!-- Заголовок -->
    <div class="modal-header">
        <h3>Edit User</h3>
        <a th:href="@{/admin}" class="close-btn">&times;</a>
    </div>

    <!-- Тело -->
    <div class="modal-body">
        <!-- Информация о пользователе -->
        <div class="user-info">
            <p><strong>admin@mail.ru</strong> with roles: <strong>ADMIN USER</strong></p>
        </div>

        <!-- Форма редактирования -->
        <form th:action="@{/admin/update}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label>First Name</label>
                <input type="text" th:field="*{name}" value="admin"/>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" th:field="*{surname}" value="admin"/>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" th:field="*{age}" value="35"/>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" value="admin@mail.ru"/>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="••••••"/>
            </div>

            <div class="form-group">
                <label>Role</label>
                <select th:name="roles" multiple size="2" style="height: 60px;">
                    <option th:each="role : ${allRoles}"
                            th:value="${role.id}"
                            th:text="${role.name == 'ROLE_ADMIN'} ? 'ADMIN' : 'USER'"
                            th:selected="${user.roles.contains(role)}">
                    </option>
                </select>
                <small style="color: #666; font-size: 11px;">Hold Ctrl to select multiple roles</small>
            </div>

            <!-- Кнопки -->
            <div class="modal-footer" style="padding: 20px 0 0 0;">
                <a th:href="@{/admin}" class="btn btn-close">Close</a>
                <button type="submit" class="btn btn-edit">Edit</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
