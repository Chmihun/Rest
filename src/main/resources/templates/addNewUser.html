<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add new user</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding-top: 20px;
        }

        .sidebar h3 {
            text-align: center;
            padding: 20px;
            margin: 0;
            border-bottom: 1px solid #34495e;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            padding: 15px 20px;
            border-bottom: 1px solid #34495e;
        }

        .sidebar li:hover {
            background-color: #34495e;
            cursor: pointer;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
        }

        .header {
            overflow: auto;
            margin-bottom: 20px;
        }

        .logout {
            background-color: #dc3545;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            float: right;
        }

        .logout:hover {
            background-color: #c82333;
            text-decoration: none;
        }

        h2 {
            margin-top: 0;
        }
        .button-group {
            display: inline-flex;
            margin-bottom: 20px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #007bff;
        }
        .users-table-btn {
            background-color: transparent;
            color: #007bff;
            padding: 6px 15px;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            border: none;
            border-right: 1px solid #007bff;
            cursor: pointer;
        }
        .new-user-btn {
            background-color: transparent;
            color: #28a745;
            padding: 6px 15px;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .users-table-btn:hover, .new-user-btn:hover {
            background-color: transparent;
            text-decoration: none;
        }

        .form-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .form-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #007bff;
        }
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
        }

        .form-group select:focus {
            outline: none;
            border-color: #007bff;
        }
        .btn-submit {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-cancel:hover {
            background-color: #5a6268;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .button-row .btn-cancel {
            flex: 1;
        }

        .button-row .btn-submit {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h3>Menu</h3>
        <ul>
            <li><a th:href="@{/admin}">Users</a></li>
            <li><a th:href="@{/user}">User</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Admin panel</h2>
            <a th:href="@{/logout}" class="logout">Logout</a>
        </div>

        <div class="button-group">
            <a th:href="@{/admin}" class="users-table-btn">Users table</a>
            <a th:href="@{/admin/add}" class="new-user-btn">New User</a>
        </div>

        <div class="form-wrapper">
            <div class="form-container">
                <form th:action="@{/admin/add}" th:object="${user}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="form-group">
                        <label>First name</label>
                        <input type="text" th:field="*{name}" required/>
                    </div>

                    <div class="form-group">
                        <label>Last name</label>
                        <input type="text" th:field="*{surname}" required/>
                    </div>

                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" th:field="*{age}" required/>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" required/>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" required/>
                    </div>

                    <div class="form-group">
                        <label>Role</label>
                        <select th:name="roles" required>
                            <option value="">Select role</option>
                            <option th:each="role : ${allRoles}"
                                    th:value="${role.id}"
                                    th:text="${role.name == 'ROLE_ADMIN'} ? 'ADMIN' : 'USER'">
                            </option>
                        </select>
                    </div>

                    <div class="button-row">
                        <button type="submit" class="btn-submit">Add new user</button>
                        <a th:href="@{/admin}" class="btn-cancel">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
