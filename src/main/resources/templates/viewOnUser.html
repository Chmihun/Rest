<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding-top: 20px;
        }

        .sidebar h3 {
            text-align: center;
            padding: 20px;
            margin: 0;
            border-bottom: 1px solid #34495e;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            padding: 15px 20px;
            border-bottom: 1px solid #34495e;
        }

        .sidebar li:hover {
            background-color: #34495e;
            cursor: pointer;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .user-table th,
        .user-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .user-table th {
            background-color: #f2f2f2;
            color: #222;
        }

        .role-admin {
            background-color: #dc3545;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .role-user {
            background-color: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .button-group {
            display: inline-flex;
            margin-bottom: 20px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #28a745;
        }

        .users-table-btn {
            background-color: transparent;
            color: #28a745;
            padding: 6px 15px;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            border: none;
            border-right: 1px solid #28a745;
            cursor: pointer;
        }

        .new-user-btn {
            background-color: transparent;
            color: #007bff;
            padding: 6px 15px;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .users-table-btn:hover {
            background-color: transparent;
            color: #28a745;
            text-decoration: none;
        }

        .new-user-btn:hover {
            background-color: transparent;
            color: #007bff;
            text-decoration: none;
        }

        h4 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            background-color: #6c757d;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-back:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Левая панель навигации -->
    <div class="sidebar">
        <h3>User</h3>
    </div>

    <div class="main-content">

        <h4>User information-page</h4>

        <table class="user-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td th:text="${user.id}">—</td>
                <td th:text="${user.name}">—</td>
                <td th:text="${user.surname}">—</td>
                <td th:text="${user.age}">—</td>
                <td th:text="${user.email}">—</td>
                <td>
                        <span th:each="role : ${user.roles}">
                            <span th:if="${role.name == 'ROLE_ADMIN'}" class="role-admin">ADMIN</span>
                            <span th:if="${role.name == 'ROLE_USER'}" class="role-user">USER</span>
                        </span>
                </td>
<!--                <td>-->
<!--                    <a th:href="@{/admin/edit/{id}(id=${user.id})}" class="btn-edit" style="background-color: #007bff; color: white; padding: 5px 10px; border-radius: 4px; text-decoration: none; font-size: 12px;">Edit</a>-->
<!--                </td>-->
            </tr>
            </tbody>
        </table>

        <!-- Кнопка назад -->
        <a th:href="@{/admin}" class="btn-back">← Back to Users</a>
    </div>
</div>

<style>
    .btn-edit:hover {
        background-color: #0056b3 !important;
        text-decoration: none;
    }
</style>

</body>
</html>
